---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    postgresql_expected_major_version: 16
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert postgresql-{{ postgresql_expected_major_version }} is installed
      ansible.builtin.assert:
        that:
          - ("postgresql-" ~ postgresql_expected_major_version) in ansible_facts.packages
        fail_msg: >-
          postgresql-{{ postgresql_expected_major_version }} is not installed;
          installed postgresql-* packages: {{ ansible_facts.packages.keys() | select('match', '^postgresql-[0-9]+$') | list }}

    - name: Assert installed version matches the requested major version
      ansible.builtin.assert:
        that:
          - ansible_facts.packages["postgresql-" ~ postgresql_expected_major_version][0].version is match(postgresql_expected_major_version ~ "\\..*")
        fail_msg: >-
          Installed version {{ ansible_facts.packages["postgresql-" ~ postgresql_expected_major_version][0].version }}
          does not belong to major version {{ postgresql_expected_major_version }}

    - name: Assert postgresql.service is enabled
      ansible.builtin.assert:
        that:
          - ansible_facts.services["postgresql.service"] is defined
          - ansible_facts.services["postgresql.service"].status == "enabled"
        fail_msg: "postgresql.service is not enabled: {{ ansible_facts.services['postgresql.service'] | default('not found') }}"

    # postgresql.service itself is a oneshot wrapper that reports "exited" (not "running") once it has
    # done its job; the actual long-running daemon is the per-cluster instance unit below.
    - name: Assert postgresql@{{ postgresql_expected_major_version }}-main.service is running
      ansible.builtin.assert:
        that:
          - ansible_facts.services["postgresql@" ~ postgresql_expected_major_version ~ "-main.service"] is defined
          - ansible_facts.services["postgresql@" ~ postgresql_expected_major_version ~ "-main.service"].state == "running"
        fail_msg: >-
          postgresql@{{ postgresql_expected_major_version }}-main.service is not running:
          {{ ansible_facts.services["postgresql@" ~ postgresql_expected_major_version ~ "-main.service"] | default('not found') }}
