---
- name: Test install action, unpinned (installs latest available version)
  hosts: unpinned
  gather_facts: false
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        postgresql_actions: install,state_control
        postgresql_major_version: 16
        postgresql_state: started

- name: Test install action, pinned to an exact PGDG version
  hosts: pinned
  gather_facts: false
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        postgresql_actions: install,state_control
        postgresql_major_version: 18
        postgresql_version: "{{ postgresql_pinned_version }}"
        postgresql_state: started
