---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: unpinned
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
  - name: pinned
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
provisioner:
  name: ansible
  inventory:
    host_vars:
      # Single source of truth for the pinned test version, referenced by both converge.yml
      # (postgresql_version) and verify.yml (postgresql_expected_version). Bump here only.
      pinned:
        postgresql_pinned_version: 18.6-1.pgdg24.04+2
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - converge
    - verify
    - cleanup
    - destroy
