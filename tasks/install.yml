- name: Validate variables for install.yml task
  ansible.builtin.assert:
    that:
      - postgresql_version is defined
      - postgresql_package is defined

- name: Install PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_package }}={{ postgresql_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
    cache_valid_time: 3600

- name: Enable PostgreSQL daemon
  ansible.builtin.service:
    name: postgresql
    enabled: true
