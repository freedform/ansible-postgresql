- name: Validate variables for install.yml task
  ansible.builtin.assert:
    that:
      - postgresql_version is defined
      - postgresql_package is defined

- name: Gather distribution facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - min
    filter: ansible_distribution_release

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download PGDG GPG key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /etc/apt/keyrings/pgdg.asc
    owner: root
    group: root
    mode: "0644"

- name: Add PGDG apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL
  ansible.builtin.apt:
    name: "{{ postgresql_package }}={{ postgresql_version }}"
    state: present
    update_cache: true
    allow_downgrade: true
    cache_valid_time: 3600

- name: Enable PostgreSQL daemon
  ansible.builtin.service:
    name: postgresql
    enabled: true
